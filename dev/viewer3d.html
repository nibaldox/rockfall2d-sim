<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>SimRocas — visor 3D (página de desarrollo)</title>
<style>
    :root {
        --bg-primary: #10141b;
        --fg-primary: #e4e6eb;
        --bg-panel: rgba(20, 26, 34, 0.9);
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-primary); color: var(--fg-primary); font-family: ui-sans-serif, system-ui, sans-serif; }
    #viewer { position: absolute; inset: 48px 0 0 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--bg-panel); z-index: 10; }
    button { padding: 6px 10px; border-radius: 6px; border: 1px solid #3a4552; background: #1b232e; color: var(--fg-primary); cursor: pointer; }
    button[aria-pressed="true"] { background: #2e79a8; border-color: #55a2d4; }
    #status { font-size: 12px; opacity: 0.85; margin-left: auto; }
</style>
<script type="importmap">
{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}
</script>
</head>
<body>
<div id="bar">
    <span>Visor 3D — DEM sintético de ladera</span>
    <button id="btn-elevation" type="button" aria-pressed="true">Cota</button>
    <button id="btn-slope" type="button" aria-pressed="false">Pendiente</button>
    <button id="btn-exag1" type="button" aria-pressed="true">Exag 1x</button>
    <button id="btn-exag2" type="button" aria-pressed="false">Exag 2x</button>
    <span id="status">cargando three.js…</span>
</div>
<div id="viewer"></div>
<script src="../js/dem.js"></script>
<script src="../js/view3d.js"></script>
<script src="../js/view3d-terrain.js"></script>
<script type="module" src="../js/three-bridge.js"></script>
<script>
(function () {
    'use strict';

    function abrirVisor() {
        montar();
    }

    // Simple ladera sintética: z = f(x) con ruido determinista y NaN en un rectángulo.
    function construirDem() {
        const SR = window.SimRocas;
        const cols = 400;
        const rows = 300;
        const cs = 1;
        // PRNG determinista (mulberry32).
        let a = 123456789 >>> 0;
        const rand = function () {
            a = (a + 0x6D2B79F5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 15)) >>> 0) / 4294967296;
        };
        const heights = new Float32Array(cols * rows);
        for (let j = 0; j < rows; j++) {
            for (let i = 0; i < cols; i++) {
                const x = i * cs;
                const y = j * cs;
                // Ladera principal de W a E con cambio de pendiente y ondulación.
                const slope = (x > 220) ? 0.35 : 0.15;
                const base = 60 - 0.15 * Math.min(x, 220) - (x > 220 ? 0.35 * (x - 220) : 0);
                const ridge = 4 * Math.sin(x * 0.03 + y * 0.02);
                const micro = (rand() - 0.5) * 0.35 + 0.8 * Math.sin(x * 0.11) * Math.cos(y * 0.09);
                let z = base + ridge + micro;
                // Escarpe abrupto (cliff) entre x=300 y x=310 para ver la franja roja.
                if (x >= 300 && x < 310) {
                    z -= 25;
                }
                // Canal con NaN (sin datos) en un rectángulo interior.
                if (x >= 150 && x <= 190 && y >= 110 && y <= 150) {
                    z = NaN;
                }
                heights[j * cols + i] = z;
            }
        }
        return new SR.Dem({
            cols: cols, rows: rows, cellSize: cs,
            heights: heights, originX: 0, originY: 0, originZ: 0,
            crs: 'local'
        });
    }

    let viewer = null;
    let mesh = null;
    let currentMode = 'elevation';

    function montar() {
        const SR = window.SimRocas;
        const container = document.getElementById('viewer');
        viewer = new SR.Viewer3D(container);
        const dem = construirDem();
        mesh = SR.TerrainMesh3D.fromDem(dem, 2 * (dem.cols - 1) * (dem.rows - 1) * 4, { colorMode: 'elevation' });
        viewer.setTerrain(mesh, { colorMode: 'elevation', exaggeration: 1, fit: true });
        document.getElementById('status').textContent =
            'THREE r' + window.THREE.REVISION + ' — ' + mesh.geometry.attributes.position.count + ' vértices, modo: cota';
    }

    document.getElementById('btn-elevation').addEventListener('click', function () {
        if (!mesh) { return; }
        window.SimRocas.TerrainMesh3D.setColorMode(mesh, 'elevation');
        currentMode = 'elevation';
        this.setAttribute('aria-pressed', 'true');
        document.getElementById('btn-slope').setAttribute('aria-pressed', 'false');
        viewer.requestRender();
        document.getElementById('status').textContent = 'THREE r' + window.THREE.REVISION + ' — modo: cota';
    });
    document.getElementById('btn-slope').addEventListener('click', function () {
        if (!mesh) { return; }
        window.SimRocas.TerrainMesh3D.setColorMode(mesh, 'slope');
        currentMode = 'slope';
        this.setAttribute('aria-pressed', 'true');
        document.getElementById('btn-elevation').setAttribute('aria-pressed', 'false');
        viewer.requestRender();
        document.getElementById('status').textContent = 'THREE r' + window.THREE.REVISION + ' — modo: pendiente';
    });
    document.getElementById('btn-exag1').addEventListener('click', function () {
        if (!viewer) { return; }
        viewer.setVerticalExaggeration(1);
        this.setAttribute('aria-pressed', 'true');
        document.getElementById('btn-exag2').setAttribute('aria-pressed', 'false');
    });
    document.getElementById('btn-exag2').addEventListener('click', function () {
        if (!viewer) { return; }
        viewer.setVerticalExaggeration(2);
        this.setAttribute('aria-pressed', 'true');
        document.getElementById('btn-exag1').setAttribute('aria-pressed', 'false');
    });

    window.SimRocas.whenThreeReady().then(abrirVisor).catch(function (err) {
        document.getElementById('status').textContent = 'ERROR: ' + err.message;
        console.error(err);
    });
})();
</script>
</body>
</html>
